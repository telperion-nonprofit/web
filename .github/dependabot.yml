version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
      timezone: "Europe/Prague"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    commit-message:
      prefix: "build(deps)"
      prefix-development: "build(deps-dev)"
      include: "scope"
    ignore:
      # TypeScript 7 is the native (Go) compiler and no longer ships the JS
      # compiler API that `astro check` (@astrojs/check) and typescript-eslint
      # load, so both cap their typescript peer at 6 and `npm ci` fails with
      # ERESOLVE. Temporary: the "TypeScript 7 readiness" workflow opens an
      # issue once both accept TypeScript 7; delete this entry then.
      - dependency-name: "typescript"
        update-types:
          - "version-update:semver-major"
    groups:
      # Patch/minor updates travel together so one green CI run lands the whole
      # week's batch instead of seven PRs racing each other.
      production-minor-patch:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
      development-minor-patch:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
      # `dependency-type` only ever matches direct dependencies, so without
      # this catch-all every transitive bump — which is most of what security
      # updates touch — arrived as its own pull request.
      transitive-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      # Majors stay ungrouped, one PR each, so a breaking update that Claude
      # has to fix (claude-fix-dependabot.yml) does not hold back the rest.

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
      timezone: "Europe/Prague"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "build(deps)"
    groups:
      github-actions:
        update-types:
          - "minor"
          - "patch"
