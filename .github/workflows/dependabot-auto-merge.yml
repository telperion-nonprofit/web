name: Dependabot auto-merge

# Runs with the base repository's token (pull_request_target) so it can enable
# auto-merge. It deliberately never checks out or executes the pull request's
# code — its only step talks to the GitHub API.
#
# Every Dependabot pull request gets auto-merge queued, majors included.
# GitHub performs the merge only once the required `CI` check passes, so a red
# CI still blocks the update; claude-fix-dependabot.yml then tries to turn it
# green.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    name: Enable auto-merge
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    steps:
      - name: Enable auto-merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --squash "$PR_URL"
