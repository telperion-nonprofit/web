name: Dependabot auto-merge

# Runs with the base repository's token (pull_request_target) so it can enable
# auto-merge. It deliberately never checks out or executes the pull request's
# code — every step only talks to the GitHub API.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    name: Enable auto-merge for safe updates
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    steps:
      # Takes the classifier from the BASE branch, never the pull request's own
      # code, so a malicious branch cannot substitute its own script. Only that
      # one path is fetched.
      - name: Check out the classifier from the base branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          sparse-checkout: scripts/classify-dependabot-update.sh
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Classify the update
        id: classify
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          message="$(gh api "repos/${REPO}/commits/${HEAD_SHA}" --jq '.commit.message')"
          verdict="$(printf '%s' "$message" | bash scripts/classify-dependabot-update.sh)"

          echo "automerge=${verdict}" >> "$GITHUB_OUTPUT"

      - name: Approve
        if: steps.classify.outputs.automerge == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        # Needed only when the branch requires an approving review; harmless
        # otherwise. Remove this step if you would rather review every bump.
        run: gh pr review --approve "$PR_URL" || true

      - name: Enable auto-merge
        if: steps.classify.outputs.automerge == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        # Queues the merge; GitHub performs it once the required checks pass, so
        # a red CI still blocks the update.
        run: gh pr merge --auto --squash "$PR_URL"

      - name: Explain why the PR was left alone
        if: steps.classify.outputs.automerge != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          echo "Held for review — see the classifier output above for why."
